<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles"></div>
    
    <div class="calculator">
        <div class="calculator-header">
            <div class="theme-toggle" onclick="toggleTheme()">
                <img src="moon-icon.png" alt="Theme Toggle" class="theme-icon" id="themeIcon">
            </div>
            <h3 class="calculator-title">CALCULATOR</h3>
        </div>
        
        <div class="display">
            <div class="previous" id="previous"></div>
            <div class="current" id="current">0</div>
        </div>
        
        <div class="buttons">
            <button class="clear" onclick="clearAll()" data-type="clear">
                <span>C</span>
            </button>
            <button class="delete" onclick="deleteNum()" data-type="delete">
                <span>X</span>
            </button>
            <button class="operator" onclick="setOperator('%')" data-type="operator">
                <span>%</span>
            </button>
            <button class="operator" onclick="setOperator('÷')" data-type="operator">
                <span>÷</span>
            </button>
            
            <button class="number" onclick="appendNumber('7')" data-type="number">
                <span>7</span>
            </button>
            <button class="number" onclick="appendNumber('8')" data-type="number">
                <span>8</span>
            </button>
            <button class="number" onclick="appendNumber('9')" data-type="number">
                <span>9</span>
            </button>
            <button class="operator" onclick="setOperator('×')" data-type="operator">
                <span>×</span>
            </button>
            
            <button class="number" onclick="appendNumber('4')" data-type="number">
                <span>4</span>
            </button>
            <button class="number" onclick="appendNumber('5')" data-type="number">
                <span>5</span>
            </button>
            <button class="number" onclick="appendNumber('6')" data-type="number">
                <span>6</span>
            </button>
            <button class="operator" onclick="setOperator('-')" data-type="operator">
                <span>-</span>
            </button>
            
            <button class="number" onclick="appendNumber('1')" data-type="number">
                <span>1</span>
            </button>
            <button class="number" onclick="appendNumber('2')" data-type="number">
                <span>2</span>
            </button>
            <button class="number" onclick="appendNumber('3')" data-type="number">
                <span>3</span>
            </button>
            <button class="operator" onclick="setOperator('+')" data-type="operator">
                <span>+</span>
            </button>
            
            <button class="number" onclick="appendNumber('0')" data-type="number">
                <span>0</span>
            </button>
            <button class="number" onclick="appendNumber('.')" data-type="number">
                <span>.</span>
            </button>
            <button class="equals" onclick="calculate()" data-type="equals">
                <span>=</span>
            </button>
            <button class="operator" onclick="calculateSquareRoot()" data-type="operator">
                <span>√</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
